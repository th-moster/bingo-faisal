<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bingo</title>
<style>
:root{
  --bg:#e9eef3; --panel:#f8fafc; --ink:#14233a; --muted:#5b6b80; --line:#b9c5d3;
  --cell:#ffffff; --mark:#1f5fbf; --mark-ink:#ffffff; --win:#e8590c; --focus:#e8590c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1824; --panel:#162233; --ink:#e6edf6; --muted:#93a3b8; --line:#2b3d55;
    --cell:#1b2a3f; --mark:#4d8fe8; --mark-ink:#0b1422; --win:#ff8a3d; --focus:#ff8a3d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1824; --panel:#162233; --ink:#e6edf6; --muted:#93a3b8; --line:#2b3d55;
  --cell:#1b2a3f; --mark:#4d8fe8; --mark-ink:#0b1422; --win:#ff8a3d; --focus:#ff8a3d;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:680px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:16px}
details.panel>summary{cursor:pointer;font-weight:700;font-size:1.05rem}
details.panel[open]>summary{margin-bottom:12px}
input[type=text]{background:var(--cell);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:inherit;width:9ch}
main.solo{grid-template-columns:minmax(0,640px);justify-content:center}
.note{font-size:.85rem;color:var(--muted);margin:0 0 8px}
.note.bad{color:var(--win);font-weight:600}
[hidden]{display:none!important}
@media (max-width:760px){main{grid-template-columns:minmax(0,1fr)}}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
p.sub{margin:0 0 16px;color:var(--muted);font-size:.92rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
textarea{width:100%;min-height:260px;resize:vertical;background:var(--cell);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px;font:inherit;font-size:.95rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
select{background:var(--cell);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:inherit}
.check{display:flex;gap:6px;align-items:center;font-size:.9rem}
.check input{width:18px;height:18px;accent-color:var(--mark)}
button{font:inherit;cursor:pointer;border-radius:6px;padding:9px 14px;border:1px solid var(--line);background:var(--cell);color:var(--ink)}
button.primary{background:var(--mark);color:var(--mark-ink);border-color:var(--mark);font-weight:600}
button:focus-visible,textarea:focus-visible,select:focus-visible,.cell:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.count{font-size:.85rem;color:var(--muted);margin-top:6px}
.count.bad{color:var(--win);font-weight:600}
.status{min-height:2rem;font-weight:700;font-size:1.15rem;margin:0 0 10px;color:var(--win)}
.board{display:grid;gap:6px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;
  background:var(--cell);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;
  font-size:var(--fs);line-height:1.15;overflow:hidden;hyphens:auto;overflow-wrap:anywhere;user-select:none;
  transition:background .12s,color .12s,transform .12s}
.cell:active{transform:scale(.97)}
.cell.on{background:var(--mark);color:var(--mark-ink);border-color:var(--mark);font-weight:600}
.cell.win{border-color:var(--win);box-shadow:0 0 0 3px var(--win)}
.cell.free{font-style:italic}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:10px}
@media (prefers-reduced-motion:reduce){.cell{transition:none}}
</style>
</head>
<body>
<main>
  <h1 style="margin:0">Bingo</h1>
  <details class="panel" id="admin" open>
    <summary>Board verwalten</summary>
    <label for="pool">Feld-Pool (ein Eintrag pro Zeile)</label>
    <textarea id="pool" spellcheck="false"></textarea>
    <div class="count" id="count"></div>
    <div class="row">
      <label for="size" style="margin:0">Größe</label>
      <select id="size">
        <option value="3">3 × 3</option>
        <option value="4">4 × 4</option>
        <option value="5" selected>5 × 5</option>
      </select>
      <label class="check" style="margin:0;font-weight:400"><input type="checkbox" id="free" checked> Freies Mittelfeld</label>
    </div>
    <div class="row">
      <button class="primary" id="gen">Neues Board für alle</button>
      <button id="reset">Markierungen löschen</button>
    </div>
    <div class="row">
      <label for="room" style="margin:0">Raum</label>
      <input type="text" id="room" maxlength="24" autocomplete="off">
      <button id="copy">Link kopieren</button>
    </div>
  </details>
  <section>
    <p class="note" id="note"></p>
    <p class="status" id="status" aria-live="polite"></p>
    <div id="boardWrap"></div>
  </section>
</main>
<script>
(function(){
  // Firebase Realtime Database URL hier eintragen, z. B.
  // "https://mein-projekt-default-rtdb.europe-west1.firebasedatabase.app"
  // Leer lassen = lokaler Modus ohne Teilen.
  var FIREBASE_URL = "https://faisal-bingo-default-rtdb.europe-west1.firebasedatabase.app/";

  var DEFAULT_POOL = [
"ENEMY KYS",
"TEAMMATES KYS",
"SUBHUMAN",
"INTING",
"FREAK",
"LOWELO",
"PDF",
"HUBRIS",
"TRY NOT TO SMILE",
"FUNPLAY",
"NO MISTAKES",
"ALL CHAT",
"FLAME",
"NO TILT CHALLENGE",
"CHAMP DIFF/BROKEN CHAMP",
"FULL MUTE",
"SHIT ROLE",
"BAD TEAMMATES",
"RACIST",
"IRL GANK",
"CALLCENTER",
"TÜR AUFMACHEN",
"FF VOTE",
"LOCK IN",
"INSULT IN VC",
"MAIN ELO?",
"YAMATOSDEATH QUOTE",
"RETARD",
"GC"
"WAS?!?!?!?",
"REPORT",
"SCHWARZER GOETHE",
"SPAM PING",
  ].join("\n");

  var $ = function(id){ return document.getElementById(id); };
  var poolEl=$("pool"), sizeEl=$("size"), freeEl=$("free"), countEl=$("count"),
      wrap=$("boardWrap"), statusEl=$("status"), noteEl=$("note"), roomEl=$("room");
  var live = !!FIREBASE_URL, state={}, room="", dirty=false, errMsg="", connected=false, es=null;

  poolEl.value = DEFAULT_POOL;

  function readRoom(){
    room=(location.hash||"").replace(/^#/,"").replace(/[^A-Za-z0-9_-]/g,"");
    if(!room){ room=Math.random().toString(36).slice(2,7); history.replaceState(null,"","#"+room); }
    roomEl.value=room;
  }
  function base(){ return FIREBASE_URL.replace(/\/$/,"")+"/bingo/"+room; }

  function items(){
    var seen={}, out=[];
    poolEl.value.split("\n").forEach(function(l){
      var t=l.trim();
      if(t && !seen[t.toLowerCase()]){ seen[t.toLowerCase()]=1; out.push(t); }
    });
    return out;
  }
  function needed(){
    var s=parseInt(sizeEl.value,10);
    return s*s - ((freeEl.checked && s%2===1)?1:0);
  }
  function updateCount(){
    var have=items().length, need=needed();
    countEl.textContent = have+" Felder im Pool, "+need+" benötigt";
    countEl.className = "count"+(have<need?" bad":"");
  }
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  // Zustand spiegeln (Firebase-Streaming-Format: Pfad + Daten, null = löschen)
  function apply(path,data){
    var p=path.split("/").filter(Boolean);
    if(!p.length){ state=data||{}; return; }
    var o=state, i;
    for(i=0;i<p.length-1;i++){ if(typeof o[p[i]]!=="object"||o[p[i]]===null) o[p[i]]={}; o=o[p[i]]; }
    if(data===null) delete o[p[p.length-1]]; else o[p[p.length-1]]=data;
  }
  function write(path,data){
    apply(path,data); render();
    if(!live) return;
    fetch(base()+path+".json",{method:data===null?"DELETE":"PUT",body:data===null?undefined:JSON.stringify(data)})
      .then(function(r){ if(!r.ok) throw new Error(r.status); if(errMsg){ errMsg=""; render(); } })
      .catch(function(){ errMsg="Änderung konnte nicht gespeichert werden (Verbindung oder Datenbank-Regeln prüfen)."; render(); });
  }

  function connect(){
    if(es){ es.close(); es=null; }
    state={}; connected=false; render();
    if(!live) return;
    es=new EventSource(base()+".json");
    es.onopen=function(){ connected=true; render(); };
    es.onerror=function(){ connected=false; render(); };
    es.addEventListener("put",function(e){
      var d=JSON.parse(e.data); apply(d.path,d.data); syncEditor(); render();
    });
    es.addEventListener("patch",function(e){
      var d=JSON.parse(e.data), pre=d.path.replace(/\/$/,"");
      Object.keys(d.data||{}).forEach(function(k){ apply(pre+"/"+k,d.data[k]); });
      syncEditor(); render();
    });
  }

  function generate(){
    var list=items(), need=needed(), n=parseInt(sizeEl.value,10), useFree=freeEl.checked && n%2===1;
    if(list.length<need){
      errMsg="Zu wenige Felder: Für "+n+" × "+n+" brauchst du mindestens "+need+" verschiedene Einträge, vorhanden sind "+list.length+".";
      render(); return;
    }
    errMsg="";
    var picked=shuffle(list.slice()).slice(0,need), cells=[], k=0, mid=(n*n-1)/2;
    for(var i=0;i<n*n;i++) cells.push(useFree && i===mid ? "" : picked[k++]);
    dirty=false;
    write("",{size:n,free:useFree,freeIdx:useFree?mid:-1,pool:poolEl.value,cells:cells});
  }

  function isOn(i){ return state.freeIdx===i || !!(state.marks && state.marks["c"+i]===true); }
  function lines(n){
    var L=[], i, j, r, c;
    for(i=0;i<n;i++){ r=[]; c=[]; for(j=0;j<n;j++){ r.push(i*n+j); c.push(j*n+i); } L.push(r,c); }
    var d1=[], d2=[]; for(i=0;i<n;i++){ d1.push(i*n+i); d2.push(i*n+(n-1-i)); }
    L.push(d1,d2); return L;
  }

  function render(){
    var base_note = !live ? "Lokaler Modus: Zum Teilen die Firebase-URL in der Datei eintragen."
      : connected ? "Live im Raum „"+room+"“: Änderungen sind für alle sofort sichtbar."
      : "Verbinde …";
    noteEl.textContent = errMsg || base_note; noteEl.className = "note"+(errMsg?" bad":"");
    if(!state.cells || !state.size){
      statusEl.textContent="";
      wrap.innerHTML='<div class="empty">Noch kein Board. Erstelle eines mit „Neues Board für alle“.</div>';
      return;
    }
    var n=state.size, on=[], i;
    for(i=0;i<n*n;i++) on.push(isOn(i));
    var winSet={}, bingos=0;
    lines(n).forEach(function(l){
      if(l.every(function(x){ return on[x]; })){ bingos++; l.forEach(function(x){ winSet[x]=1; }); }
    });
    statusEl.textContent = bingos ? (bingos>1 ? "Bingo! ("+bingos+" Reihen)" : "Bingo!") : "";
    var fs = n===3 ? "clamp(.85rem,3.4vw,1.25rem)" : n===4 ? "clamp(.72rem,2.7vw,1.05rem)" : "clamp(.62rem,2.2vw,.92rem)";
    var active=document.activeElement, keep = active && active.dataset ? active.dataset.i : null;
    var html='<div class="board" style="--n:'+n+';--fs:'+fs+'" role="grid">';
    for(i=0;i<n*n;i++){
      var free = state.freeIdx===i;
      var cls="cell"+(on[i]?" on":"")+(free?" free":"")+(winSet[i]?" win":"");
      html+='<button type="button" class="'+cls+'" data-i="'+i+'" aria-pressed="'+on[i]+'"'+(free?" disabled":"")+'>'+esc(free?"Frei":(state.cells[i]||""))+'</button>';
    }
    wrap.innerHTML=html+"</div>";
    if(keep!==null){ var el=wrap.querySelector('.cell[data-i="'+keep+'"]'); if(el&&!el.disabled) el.focus(); }
  }

  function syncEditor(){
    if(dirty || !state.pool) return;
    poolEl.value=state.pool; sizeEl.value=String(state.size); freeEl.checked=!!state.free; updateCount();
  }

  wrap.addEventListener("click",function(e){
    var b=e.target.closest(".cell"); if(!b||b.disabled||!state.cells) return;
    var i=+b.dataset.i;
    write("/marks/c"+i, isOn(i)?null:true);
  });
  $("gen").addEventListener("click",generate);
  $("reset").addEventListener("click",function(){ if(state.cells) write("/marks",null); });
  $("copy").addEventListener("click",function(){
    try{ navigator.clipboard.writeText(location.href).then(function(){ $("copy").textContent="Kopiert"; setTimeout(function(){ $("copy").textContent="Link kopieren"; },1500); }); }catch(e){}
  });
  roomEl.addEventListener("change",function(){
    var v=roomEl.value.replace(/[^A-Za-z0-9_-]/g,"");
    if(v) location.hash=v;
  });
  window.addEventListener("hashchange",function(){ readRoom(); dirty=false; connect(); });
  poolEl.addEventListener("input",function(){ dirty=true; updateCount(); });
  sizeEl.addEventListener("change",function(){ dirty=true; updateCount(); });
  freeEl.addEventListener("change",function(){ dirty=true; updateCount(); });

  readRoom(); updateCount(); connect();
})();
</script>
</body>
</html>
